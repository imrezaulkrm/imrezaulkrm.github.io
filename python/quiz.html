<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Quiz — My Python Journey</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="logo" style="display: flex; align-items: center; gap: 8px;">
                <span>🐍</span>
                <span data-i18n="app_title">My Python Journey</span>
            </a>
            <div class="nav-right">
                <div class="language-switcher">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-btn" data-lang="bn">বাংলা</button>
                </div>
                <a href="dashboard.html" class="nav-link" data-i18n="nav_dashboard">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="quiz-container">
        <!-- Quiz Interface -->
        <div id="quizInterface" class="quiz-interface" style="display: none;">
            <div class="quiz-header">
                <div class="eyebrow" style="margin-bottom: 8px;" data-i18n="chapter_quiz">Chapter Quiz</div>
                <h1 id="quizTitle" style="font-size: 26px; margin-bottom: 16px;">Python Quiz</h1>
                <div class="quiz-progress">
                    <span id="questionCounter" class="question-counter">Question 1 / 5</span>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <div class="quiz-content">
                <div id="questionContent" class="question-content">
                    <h2 id="questionText" style="font-size: 20px; line-height: 1.6; margin-bottom: 24px;">Loading question...</h2>
                    <div id="optionsContainer" class="options-container"></div>
                </div>
            </div>

            <div class="quiz-footer" style="display: flex; justify-content: space-between; align-items: center;">
                <a href="dashboard.html" class="btn btn-outline">← <span data-i18n="nav_dashboard">Dashboard</span></a>
                <button id="submitAnswerBtn" class="btn btn-primary btn-large" data-i18n="next">Next Question →</button>
            </div>
        </div>

        <!-- Quiz Result Screen -->
        <div id="quizResult" class="quiz-result" style="display: none;">
            <div class="result-header">
                <div class="eyebrow" style="margin-bottom: 8px;">Assessment Completed</div>
                <h1 data-i18n="quiz_complete">Quiz Complete!</h1>
            </div>

            <div class="result-summary">
                <div class="score-circle">
                    <div id="scorePercentage" class="percentage">0%</div>
                    <div class="score-text">
                        <span id="scoreCount" style="font-weight: 700; font-size: 16px; color: var(--text-primary);">0 / 0</span>
                        <span data-i18n="correct">Correct</span>
                    </div>
                </div>

                <div id="resultStatus" class="result-status">
                    <p class="status-title" data-i18n="passed">Passed ✓</p>
                    <p class="status-message" data-i18n="chapter_unlocked">Next chapter unlocked!</p>
                </div>
            </div>

            <div id="detailedResults" class="detailed-results">
                <h2 data-i18n="detailed_results" style="font-size: 18px; margin-bottom: 16px;">Detailed Results & Explanations</h2>
                <div id="resultsList"></div>
            </div>

            <div class="result-actions">
                <button id="retryQuizBtn" class="btn btn-outline" data-i18n="retry_quiz">Retry Quiz</button>
                <button id="continueBtn" class="btn btn-primary" data-i18n="continue_reading">Continue Reading →</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="quizLoading" class="quiz-loading">
            <div class="loading-spinner"></div>
            <p data-i18n="loading_quiz">Loading chapter quiz...</p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
