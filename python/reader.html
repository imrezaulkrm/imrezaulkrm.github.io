<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader — My Python Journey</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/reader.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-left" style="display: flex; align-items: center; gap: 14px;">
                <a href="dashboard.html" class="logo" style="display: flex; align-items: center; gap: 8px; font-size: 16px;">
                    <span>←</span>
                    <span data-i18n="app_title">My Python Journey</span>
                </a>
            </div>
            <div class="nav-right">
                <div class="language-switcher">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-btn" data-lang="bn">বাংলা</button>
                </div>
                <a href="dashboard.html" class="nav-link" data-i18n="nav_dashboard">Dashboard</a>
                <a href="#" id="logoutBtn" class="nav-link" data-i18n="logout" style="color: var(--accent-danger);">Logout</a>
            </div>
        </div>
    </nav>

    <div class="reader-container">
        <!-- Sidebar / Table of Contents -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 16px;">📚</span>
                    <h3 data-i18n="contents" style="font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0;">Contents</h3>
                </div>
                <button id="toggleSidebar" class="toggle-btn" aria-label="Toggle contents sidebar">☰</button>
            </div>
            <div id="contentsList" class="contents-list">
                <div class="loading-message" data-i18n="loading">Loading table of contents...</div>
            </div>
            <div style="border-top: 1px solid var(--border-color); margin-top: 24px; padding-top: 16px;">
                <a href="dashboard.html" class="btn btn-outline btn-block" style="font-size: 13px;">← <span data-i18n="nav_dashboard">Dashboard</span></a>
            </div>
        </aside>

        <!-- Main Reading Area -->
        <main class="reader-main">
            <div id="readerContent" class="reader-content">
                <div class="loading-message" data-i18n="loading">Loading chapter content...</div>
            </div>

            <!-- Bottom Navigation -->
            <div class="reader-nav">
                <button id="prevBtn" class="btn btn-outline" data-i18n="previous">Previous</button>
                <button id="nextBtn" class="btn btn-primary" data-i18n="take_quiz">Take Chapter Quiz →</button>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/reader.js"></script>
</body>
</html>
