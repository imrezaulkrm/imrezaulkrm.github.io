<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Stay Happy</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: #1f2a36;
        }

        #msg {
            font-size: 45px;
            z-index: 10;
            padding: 20px;
            transition: all 0.5s ease;
            opacity: 1;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) scale(1);
                opacity: 0.6;
            }

            to {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- 🎵 BACKGROUND MUSIC (AUTO LOOP) -->
    <audio id="bgMusic" autoplay loop>
        <source src="audio/happy1.mp3" type="audio/mp3">
    </audio>

    <div id="msg">Stay Happy Always</div>

    <script>

        // autoplay fix (browser restriction workaround)
        window.addEventListener("load", () => {
            const music = document.getElementById("bgMusic");
            music.volume = 0.4;

            let playPromise = music.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    // if autoplay blocked, try again silently
                    document.body.addEventListener("click", () => {
                        music.play();
                    }, { once: true });
                });
            }
        });

        // ---------------- MESSAGES ----------------
        const messages = [
            "Stay Happy Always",
            "You Are Amazing",
            "Keep Smiling Today",
            "Good Vibes Only",
            "Believe In Yourself",
            "Everything Will Be Fine",
            "You Can Do It",
            "Stay Strong Always",
            "Think Positive Daily",
            "Enjoy Your Life",
            "Be Happy Now",
            "Never Give Up",
            "You Matter Most",
            "Peace And Love",
            "Bright Future Ahead",
            "Smile Every Moment",
            "Life Is Beautiful",
            "Stay Calm Stay Strong",
            "You Are Enough",
            "Happiness Is Free",
            "Dream Big Always",
            "Keep Going Forward",
            "Shine Like Sun",
            "Love Yourself More",
            "Breathe And Relax",
            "Better Days Ahead",
            "Trust The Process",
            "Keep Moving Forward",
            "Your Time Will Come",
            "Magic Is Real",
            "Be Your Best Self",
            "Small Steps Matter",
            "Stay Positive Always",
            "Focus On Good Things",
            "You Are Loved",
            "Calm Mind Strong Heart",
            "Let It Flow",
            "Make Today Count",
            "Dream Believe Achieve",
            "Rise And Shine",
            "Energy Is Everything",
            "Create Your Happiness",
            "Keep Your Spark",
            "Life Goes On Beautifully",
            "Breathe Deep Smile",
            "Keep Your Hope",
            "You Are Strong",
            "Stay Light Hearted",
            "Joy Is Within",
            "Progress Not Perfection",
            "Be Kind Always",
            "Keep It Simple",
            "Shine From Within",
            "Trust Your Journey",
            "Peace Starts Here",
            "Grow Through Pain",
            "Let Go Worry",
            "Focus On Now",
            "Create Your Path",
            "Stay Humble Always",
            "Rise Every Time",
            "Positive Mindset Wins",
            "You Are Magic",
            "Stay Grounded Always",
            "Chase Your Dreams",
            "Inner Peace Matters",
            "Choose Happiness Daily",
            "Be Fearless Today",
            "Life Is Short Smile",
            "Keep Moving Forward",
            "Radiate Good Energy",
            "Nothing Is Impossible",
            "Stay True Yourself",
            "Light Up World",
            "Make It Happen",
            "Silence Your Doubts",
            "Peaceful Mind Strong Soul",
            "Believe And Achieve",
            "Stay Soft Stay Strong",
            "Good Things Coming",
            "Never Stop Trying",
            "Own Your Journey",
            "Everything Will Align",
            "Stay Hopeful Always",
            "Be Your Energy",
            "Let Dreams Grow",
            "Step By Step",
            "Calm Heart Brave Mind",
            "Shine Without Fear",
            "Keep Growing Daily"
        ];

        let lastMessage = "";

        // ---------------- MESSAGE CHANGE ----------------
        function changeMessage() {
            const el = document.getElementById("msg");

            el.style.opacity = "0";
            el.style.transform = "scale(0.7)";

            setTimeout(() => {
                let random;

                do {
                    random = messages[Math.floor(Math.random() * messages.length)];
                } while (random === lastMessage);

                lastMessage = random;

                el.innerText = random;

                el.style.opacity = "1";
                el.style.transform = "scale(1)";
            }, 250);
        }

        setInterval(changeMessage, 3500);

        // ---------------- BUBBLES ----------------
        function createBubbles() {
            for (let i = 0; i < 25; i++) {
                let bubble = document.createElement("div");
                bubble.classList.add("bubble");

                let size = Math.random() * 60 + 10;

                bubble.style.width = size + "px";
                bubble.style.height = size + "px";
                bubble.style.left = Math.random() * 100 + "vw";
                bubble.style.animationDuration = (Math.random() * 10 + 5) + "s";
                bubble.style.animationDelay = Math.random() * 5 + "s";

                document.body.appendChild(bubble);
            }
        }

        createBubbles();

    </script>

</body>

</html>
