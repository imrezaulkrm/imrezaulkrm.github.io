<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Section Cinematic</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #07070b;
            color: #fff;
            font-family: system-ui;
            overflow-x: hidden;
        }

        .section {
            padding: 120px 20px;
            max-width: 1200px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 70px;
        }

        .header h1 {
            font-size: 52px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .header p {
            color: #aaa;
            margin-top: 10px;
        }

        /* 🔥 CINEMATIC GRID (masonry-like) */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 120px;
            gap: 18px;
        }

        @media(max-width:900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* VARIETY SIZES */
        .tall {
            grid-row: span 3;
        }

        .wide {
            grid-column: span 2;
        }

        .big {
            grid-column: span 2;
            grid-row: span 2;
        }

        .item {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            cursor: pointer;
            transform: translateY(40px) scale(0.98);
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.25);
            filter: brightness(0.8);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
            opacity: 0;
            transform: translateY(20px);
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 14px;
        }
    </style>
</head>

<body>

    <div class="section">

        <div class="header">
            <h1 class="title">Cinematic Photography</h1>
            <p>Depth • Motion • Storytelling</p>
        </div>

        <div class="grid">

            <div class="item tall" onclick="openImg(this)">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" />
                <div class="overlay">Mountain Silence</div>
            </div>

            <div class="item wide" onclick="openImg(this)">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" />
                <div class="overlay">Golden Horizon</div>
            </div>

            <div class="item" onclick="openImg(this)">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" />
                <div class="overlay">Deep Forest</div>
            </div>

            <div class="item big" onclick="openImg(this)">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" />
                <div class="overlay">City Motion</div>
            </div>

            <div class="item tall" onclick="openImg(this)">
                <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429" />
                <div class="overlay">Ocean Flow</div>
            </div>

            <div class="item" onclick="openImg(this)">
                <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d" />
                <div class="overlay">Human Frame</div>
            </div>

        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeImg()">
        <img id="lbImg" />
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        /* HERO TEXT */
        gsap.from(".title", {
            opacity: 0,
            y: 80,
            duration: 1.2,
            ease: "power4.out"
        });

        /* CINEMATIC GRID ANIMATION */
        gsap.utils.toArray(".item").forEach((el, i) => {

            gsap.to(el, {
                scrollTrigger: {
                    trigger: el,
                    start: "top 85%",
                    toggleActions: "play none none reverse"
                },
                opacity: 1,
                y: 0,
                scale: 1,
                duration: 1,
                ease: "power3.out",
                delay: i * 0.05
            });

            gsap.fromTo(el.querySelector("img"),
                { scale: 1.4 },
                {
                    scale: 1,
                    scrollTrigger: {
                        trigger: el,
                        start: "top 90%",
                        scrub: true
                    }
                }
            );

            gsap.to(el.querySelector(".overlay"), {
                opacity: 1,
                y: 0,
                scrollTrigger: {
                    trigger: el,
                    start: "top 80%"
                }
            });

        });

        /* LIGHTBOX CINEMATIC */
        function openImg(el) {
            const lb = document.getElementById("lightbox");
            const img = document.getElementById("lbImg");

            img.src = el.querySelector("img").src;
            lb.style.display = "flex";

            gsap.fromTo(lb, { opacity: 0 }, { opacity: 1, duration: 0.3 });
            gsap.fromTo(img, { scale: 0.6, rotate: -3 }, { scale: 1, rotate: 0, duration: 0.5, ease: "power3.out" });
        }

        function closeImg() {
            const lb = document.getElementById("lightbox");
            const img = document.getElementById("lbImg");

            gsap.to(img, { scale: 0.6, opacity: 0, duration: 0.2 });
            gsap.to(lb, { opacity: 0, duration: 0.3, onComplete: () => lb.style.display = "none" });
        }
    </script>

</body>

</html>
