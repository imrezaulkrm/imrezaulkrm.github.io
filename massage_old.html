<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Message</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;900&family=Lora:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0b0a;
            --text: #f2e8dc;
            --dim: #a89888;
            --accent: #d4837c;
            --accent2: #c46b62;
            --muted: #7a6b62;
            --border: #2a2420
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none
        }

        body {
            font-family: 'Lora', 'Noto Sans Bengali', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100vw;
            height: 100vh
        }

        @media print {
            body {
                display: none !important
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important
            }
        }

        .pg {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1
        }

        .pg.on {
            opacity: 1;
            pointer-events: all
        }

        .bgcv {
            position: absolute;
            inset: 0;
            z-index: 0
        }

        .gl {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .1;
            pointer-events: none;
            z-index: 0
        }

        .crd {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2.5rem 2rem;
            background: rgba(18, 15, 13, .92);
            border: 1px solid var(--border);
            border-radius: 1.2rem;
            backdrop-filter: blur(24px);
            max-width: 400px;
            width: 90%;
            animation: cf 6s ease-in-out infinite;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4)
        }

        @keyframes cf {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-5px)
            }
        }

        .ipt {
            width: 100%;
            padding: .78rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: .6rem;
            color: var(--text);
            font-family: inherit;
            font-size: .9rem;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
            margin-bottom: .8rem
        }

        .ipt:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 131, 124, .12)
        }

        .ipt::placeholder {
            color: var(--muted)
        }

        .bt {
            width: 100%;
            padding: .82rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: var(--bg);
            border: none;
            border-radius: .6rem;
            font-family: inherit;
            font-size: .93rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s, box-shadow .3s;
            margin-top: .2rem
        }

        .bt:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 131, 124, .25)
        }

        .bt:active {
            transform: translateY(0)
        }

        .er {
            color: var(--accent2);
            font-size: .8rem;
            margin-top: .8rem;
            min-height: 1.1em;
            transition: opacity .3s
        }

        .dv {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 0 auto 1.5rem
        }

        #transPg {
            z-index: 50
        }

        .trt {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            color: var(--accent);
            opacity: 0;
            transform: scale(.8);
            transition: opacity 1s ease, transform 1s ease
        }

        .trt.i {
            opacity: 1;
            transform: scale(1)
        }

        .trt.o {
            opacity: 0;
            transform: scale(1.08)
        }

        .wo {
            height: 135px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
            max-width: 720px;
            width: 92%
        }

        .wi {
            transition: transform .5s cubic-bezier(.4, 0, .2, 1);
            line-height: 2.2;
            font-size: clamp(1.05rem, 2.8vw, 1.3rem);
            font-weight: 400;
            color: var(--text)
        }

        .ws {
            display: inline;
            opacity: 0;
            animation: wI .4s ease forwards
        }

        @keyframes wI {
            from {
                opacity: 0;
                filter: blur(3px)
            }

            to {
                opacity: 1;
                filter: blur(0)
            }
        }

        .pt {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2.5px;
            background: var(--border);
            z-index: 10
        }

        .pf {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width .35s ease
        }

        .sh {
            position: fixed;
            bottom: 2.2rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--muted);
            font-size: .72rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .3rem;
            z-index: 2;
            transition: opacity .5s
        }

        .sh.g {
            opacity: 0;
            pointer-events: none
        }

        .sa {
            width: 13px;
            height: 13px;
            border-right: 1.5px solid var(--muted);
            border-bottom: 1.5px solid var(--muted);
            transform: rotate(45deg);
            animation: sb 2s ease-in-out infinite
        }

        @keyframes sb {

            0%,
            100% {
                transform: rotate(45deg) translateY(-3px)
            }

            50% {
                transform: rotate(45deg) translateY(3px)
            }
        }

        .em {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 3.5vw, 1.7rem);
            color: var(--accent);
            opacity: 0;
            transform: scale(.85);
            transition: opacity 1.4s ease, transform 1.4s ease;
            margin-top: 1.5rem
        }

        .em.i {
            opacity: 1;
            transform: scale(1)
        }

        .lr {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: sp 1s linear infinite;
            margin: 0 auto 1.3rem
        }

        @keyframes sp {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes shk {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-8px)
            }

            40% {
                transform: translateX(8px)
            }

            60% {
                transform: translateX(-5px)
            }

            80% {
                transform: translateX(5px)
            }
        }

        /* ভিজিটর থিম */
        .vt {
            --accent: #c4a06a;
            --accent2: #b08a50
        }

        .vt .pf {
            background: linear-gradient(90deg, #c4a06a, #b08a50)
        }

        .vt .ipt:focus {
            border-color: #c4a06a;
            box-shadow: 0 0 0 3px rgba(196, 160, 106, .12)
        }

        .vt .bt {
            background: linear-gradient(135deg, #c4a06a, #b08a50)
        }

        .vt .er {
            color: #b08a50
        }

        .vt .dv {
            background: linear-gradient(90deg, transparent, #c4a06a, transparent)
        }

        .vt .trt {
            color: #c4a06a
        }

        .vt .em {
            color: #c4a06a
        }

        .vt .lr {
            border-top-color: #c4a06a
        }

        .wm {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: .02;
            background: repeating-linear-gradient(-45deg, transparent, transparent 120px, rgba(212, 131, 124, .1) 120px, rgba(212, 131, 124, .1) 121px)
        }

        @media(max-width:640px) {
            .crd {
                padding: 2rem 1.3rem
            }

            .wo {
                height: 110px
            }
        }

        /* সিন্থির প্রিমিয়াম স্টাইল */
        #sPg {
            background: linear-gradient(135deg, rgba(13, 11, 10, 0.95), rgba(20, 18, 16, 0.95));
        }

        #sPg .wo {
            max-width: 800px;
            min-height: 150px;
        }

        #sPg .em {
            font-size: clamp(1.4rem, 4vw, 2rem);
            margin-top: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        /* রিলোড বাটন */
        .rl-btn {
            position: fixed;
            bottom: 3.5rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            background: rgba(212, 131, 124, 0.1);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .rl-btn.show {
            opacity: 1;
            pointer-events: all;
        }

        .rl-btn:hover {
            background: rgba(212, 131, 124, 0.2);
            transform: scale(1.1) rotate(90deg);
        }

        .rl-btn:active {
            transform: scale(0.95) rotate(90deg);
        }

        .vt .rl-btn {
            border-color: #c4a06a;
            background: rgba(196, 160, 106, 0.1);
            color: #c4a06a;
        }

        .vt .rl-btn:hover {
            background: rgba(196, 160, 106, 0.2);
        }
    </style>
</head>

<body>
    <div class="wm"></div>

    <!-- ল্যান্ডিং -->
    <div id="landPg" class="pg on">
        <canvas id="landCv" class="bgcv"></canvas>
        <div class="gl" style="width:260px;height:260px;background:var(--accent);top:20%;left:10%"></div>
        <div class="gl" style="width:200px;height:200px;background:var(--accent2);bottom:15%;right:10%"></div>
        <div class="crd" id="landCrd">
            <h1
                style="font-family:'Playfair Display',serif;font-weight:700;font-size:1.7rem;color:var(--accent);margin-bottom:.3rem">
                Secret Message</h1>
            <p style="color:var(--dim);font-size:.82rem;font-weight:300;margin-bottom:.5rem">একটি গোপন বার্তা অপেক্ষা
                করছে</p>
            <div class="dv"></div>
            <input type="password" id="pIn" class="ipt" placeholder="পাসওয়ার্ড" autocomplete="off">
            <button id="lBtn" class="bt">প্রবেশ করুন</button>
            <p id="eTxt" class="er"></p>

    <!-- ট্রানজিশন -->
    <div id="transPg" class="pg">
        <h1 class="trt" id="trT"></h1>
    </div>

    <!-- সিন্থি মেসেজ -->
    <div id="sPg" class="pg">
        <canvas id="sCv" class="bgcv"></canvas>
        <div class="gl" style="width:340px;height:340px;background:#d4837c;top:22%;left:14%"></div>
        <div class="gl" style="width:260px;height:260px;background:#c46b62;bottom:16%;right:10%"></div>
        <button id="sReload" class="rl-btn show" title="রিলোড">⟲</button>
        <div style="position:relative;z-index:1;text-align:center;width:100%">
            <p
                style="font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(1rem,2.8vw,1.3rem);color:#d4837c;margin-bottom:.25rem">
                বিশেষ বার্তা</p>
            <div class="wo" id="sO">
                <div class="wi" id="sI"></div>
            </div>
            <div class="em" id="sE">চিরকাল তোমাদের</div>
        </div>
        <div class="sh" id="sH"><span>স্ক্রল করুন</span>
            <div class="sa"></div>
        </div>
        <div class="pt">
            <div class="pf" id="sB"></div>
        </div>
        <audio id="sAu" loop preload="auto">
            <source src="music/sinthi.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- ভিজিটর নাম ইনপুট -->
    <div id="vIPg" class="pg vt">
        <canvas id="vICv" class="bgcv"></canvas>
        <div class="gl" style="width:240px;height:240px;background:#c4a06a;top:25%;left:12%"></div>
        <div class="gl" style="width:180px;height:180px;background:#b08a50;bottom:20%;right:15%"></div>
        <div class="crd" id="vICrd">
            <h1
                style="font-family:'Playfair Display',serif;font-weight:700;font-size:1.5rem;color:#c4a06a;margin-bottom:.3rem">
                আপনি কে?</h1>
            <p style="color:var(--dim);font-size:.82rem;font-weight:300;margin-bottom:.5rem">আপনার নাম লিখুন</p>
            <div class="dv"></div>
            <input type="text" id="nIn" class="ipt" placeholder="আপনার নাম" autocomplete="off">
            <button id="nBtn" class="bt">বার্তা দেখুন</button>
            <p id="nEr" class="er"></p>
        </div>
    </div>

    <!-- লোডিং -->
    <div id="ldPg" class="pg vt">
        <div style="text-align:center">
            <div class="lr"></div>
            <p style="color:var(--dim);font-size:.92rem" id="ldT">বার্তা তৈরি হচ্ছে...</p>
        </div>
    </div>

    <!-- ভিজিটর মেসেজ -->
    <div id="vMPg" class="pg vt">
        <canvas id="vMCv" class="bgcv"></canvas>
        <div class="gl" style="width:320px;height:320px;background:#c4a06a;top:24%;left:16%"></div>
        <div class="gl" style="width:240px;height:240px;background:#b08a50;bottom:18%;right:12%"></div>
        <button id="vReload" class="rl-btn show" title="রিলোড">⟲</button>
        <div style="position:relative;z-index:1;text-align:center;width:100%">
            <p id="vTi"
                style="font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(1rem,2.8vw,1.3rem);color:#c4a06a;margin-bottom:.25rem">
                বার্তা</p>
            <div class="wo" id="vO">
                <div class="wi" id="vI"></div>
            </div>
            <div class="em" id="vE"></div>
        </div>
        <div class="sh" id="vH"><span>স্ক্রল করুন</span>
            <div class="sa"></div>
        </div>
        <div class="pt">
            <div class="pf" id="vB"></div>
        </div>
        <audio id="vAu" loop preload="auto">
            <source src="music/visitor.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const PASSWORD = "sinthi";
        const SINTHI_MSG = `সিন্থি, এই বার্তা লেখার সময় আমার মনে অনেক কথা এসেছে যেগুলো সবসময় মুখে বলা হয় না। জীবনে অনেক মানুষ আসে যায়, কিন্তু কেউ কেউ থাকে শুধু তাদের উপস্থিতিতে সবকিছু অন্যরকম অনুভব হয়। তুমি সেই অনুভূতি নিয়ে এসেছ আমার জীবনে। আমরা একসাথে যত দিন কাটিয়েছি, প্রতিটি দিনে শিখেছি কিভাবে আরও ভালো হওয়া যায়। তোমার দৃষ্টিভঙ্গি, তোমার শক্তি, তোমার সাহস - এগুলো আমাকে প্রতিদিন অনুপ্রাণিত করে। সিন্থি, তুমি একটি সম্পূর্ণ মানুষ নিজেই, তোমার স্বপ্ন, তোমার লক্ষ্য, তোমার সম্ভাবনা - এই সবগুলো অসাধারণ। আমি গর্বিত যে আমি তোমার এই যাত্রার অংশ হতে পেরেছি। জীবন কঠিন হবে, কিন্তু যখন দুজন একসাথে থাকে তখন কোনো চ্যালেঞ্জই বড় নয়। আমি প্রতিশ্রুতি দিচ্ছি যে আমি সবসময় তোমার পাশে থাকবো - যখন সবকিছু ভালো থাকবে এবং যখন ঝড় আসবে উভয় সময়ে। তোমার স্বপ্ন বাস্তবায়নে আমি সর্বদা তোমার সহযোগী হতে চাই। এই যাত্রা চিরস্থায়ী হোক, এই ভালোবাসা চিরকাল থাক। সিন্থি, তুমি শুধু আমার সঙ্গী নও, তুমি আমার অনুপ্রেরণা। ভবিষ্যৎ উজ্জ্বল, কারণ তুমি আছ।`;

        const toBn = n => String(n).split('').map(c => '০१२३४५६७८९'[+c] || c).join('');

        function showPg(id) {
            document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
            document.getElementById(id).classList.add('on');
        }

        function shake(el) {
            el.style.animation = 'none'; void el.offsetHeight;
            el.style.animation = 'shk .4s ease';
        }

        const pState = {};
        function startP(key, cvId, colors, n) {
            if (pState[key]) return;
            pState[key] = true;
            const cv = document.getElementById(cvId);
            const cx = cv.getContext('2d');
            const P = [];
            function sz() { cv.width = innerWidth; cv.height = innerHeight; }
            sz(); addEventListener('resize', sz);
            for (let i = 0; i < n; i++) P.push(mkP(colors));
            function mkP(c) {
                return { x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 2 + .3, vx: (Math.random() - .5) * .2, vy: -Math.random() * .4 - .05, o: Math.random() * .4 + .06, fd: Math.random() * .003 + .001, fi: true, c: c[Math.random() * c.length | 0] };
            }
            (function draw() {
                cx.clearRect(0, 0, cv.width, cv.height);
                P.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.fi) { p.o += p.fd; if (p.o >= .5) p.fi = false; }
                    else { p.o -= p.fd; if (p.o <= 0) Object.assign(p, mkP(colors), { y: cv.height + 10 }); }
                    if (p.y < -10 || p.x < -10 || p.x > cv.width + 10) Object.assign(p, mkP(colors), { y: cv.height + 10 });
                    const r = Math.max(.1, p.r);
                    cx.beginPath(); cx.arc(p.x, p.y, r, 0, 6.283);
                    cx.fillStyle = `rgba(${p.c},${p.o})`; cx.fill();
                    const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(.1, r * 3.5));
                    g.addColorStop(0, `rgba(${p.c},${p.o * .15})`);
                    g.addColorStop(1, `rgba(${p.c},0)`);
                    cx.beginPath(); cx.arc(p.x, p.y, Math.max(.1, r * 3.5), 0, 6.283);
                    cx.fillStyle = g; cx.fill();
                });
                requestAnimationFrame(draw);
            })();
        }

        class WordReveal {
            constructor(oId, iId, bId, hId, eId) {
                this.o = document.getElementById(oId);
                this.i = document.getElementById(iId);
                this.b = document.getElementById(bId);
                this.h = document.getElementById(hId);
                this.e = document.getElementById(eId);
                this.words = []; this.shown = 0; this.busy = false; this.hOn = true; this.fin = false;
            }
            init(text) {
                this.words = text.split(/\s+/).filter(w => w);
                this.shown = 0; this.fin = false; this.hOn = true;
                this.i.innerHTML = ''; this.i.style.transform = 'translateY(0)';
                this.h.classList.remove('g'); this.e.classList.remove('i');
            }
            add(n) {
                if (this.busy || this.fin) return false;
                this.busy = true;
                const cnt = Math.min(n, this.words.length - this.shown);
                if (cnt <= 0) { this.busy = false; this.done(); return false; }
                for (let i = 0; i < cnt; i++) {
                    const s = document.createElement('span');
                    s.className = 'ws'; s.textContent = this.words[this.shown] + ' ';
                    this.i.appendChild(s); this.shown++;
                }
                if (this.hOn && this.shown > 4) { this.h.classList.add('g'); this.hOn = false; }
                this.adj();
                if (this.shown >= this.words.length) this.done();
                setTimeout(() => this.busy = false, 180);
                return true;
            }
            rem(n) {
                if (this.busy || this.shown <= 0) return;
                this.busy = true;
                const cnt = Math.min(n, this.shown);
                for (let i = 0; i < cnt; i++) {
                    if (this.i.lastChild) this.i.removeChild(this.i.lastChild);
                    this.shown--;
                }
                this.e.classList.remove('i'); this.fin = false;
                this.adj();
                setTimeout(() => this.busy = false, 180);
            }
            adj() {
                const ih = this.i.scrollHeight, oh = this.o.clientHeight;
                this.i.style.transform = ih > oh ? `translateY(-${ih - oh}px)` : 'translateY(0)';
            }
            done() {
                if (!this.fin) { this.fin = true; setTimeout(() => this.e.classList.add('i'), 600); }
            }
        }

        function playMu(audioId, type) {
            const au = document.getElementById(audioId);
            au.volume = 0.35;
            const p = au.play();
            if (p && p.catch) p.catch(() => fallbackMu(type));
        }

        function fallbackMu(type) {
            try {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                const m = ac.createGain(); m.gain.value = .07; m.connect(ac.destination);
                const d = ac.createDelay(); d.delayTime.value = .3;
                const f = ac.createGain(); f.gain.value = .3;
                const l = ac.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = 1600;
                d.connect(l); l.connect(f); f.connect(d); d.connect(m);
                const warm = [[261.63, 392], [329.63, 493.88], [293.66, 440], [349.23, 523.25]];
                const cool = [[220, 329.63], [261.63, 392], [246.94, 349.23], [293.66, 440]];
                const pat = type === 'warm' ? warm : cool;
                let t = ac.currentTime + .2;
                for (let i = 0; i < 200; i++) {
                    pat[i % pat.length].forEach(freq => {
                        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
                        const g = ac.createGain();
                        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.025, t + .6);
                        g.gain.linearRampToValueAtTime(0, t + 2.6);
                        o.connect(g); g.connect(m); g.connect(d); o.start(t); o.stop(t + 2.8);
                    });
                    t += 2.3;
                }
            } catch (e) { }
        }

        function trans(text, cb) {
            const t = document.getElementById('trT');
            t.textContent = text; t.className = 'trt';
            showPg('transPg');
            setTimeout(() => t.classList.add('i'), 80);
            setTimeout(() => { t.classList.remove('i'); t.classList.add('o'); }, 2000);
            setTimeout(cb, 2800);
        }

        async function aiMsg(name) {
            const prompt = `"${name}" নামের একজনের জন্য বাংলায় একটি অনুপ্রেরণামূলক জীবন পরামর্শ বার্তা লিখো। এটি হবে গভীর চিন্তা, জীবনের পাঠ এবং ব্যক্তিগত উন্নয়ন সম্পর্কে। কমপক্ষে ২৫০ শব্দ হবে। বার্তাটি হবে গুরুত্বপূর্ণ, চিন্তাশীল এবং মানবিক - কোনো কৃত্রিম বন্ধুত্ব বা ভালোবাসার অনুভূতি প্রকাশ করো না।`;
            try {
                const res = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: [{ role: 'user', content: prompt }], model: 'openai', temperature: 0.8 })
                });
                if (!res.ok) throw new Error('err');
                let txt = await res.text();
                txt = txt.replace(/[#*_`~\[\]()]/g, '').replace(/\n+/g, ' ').trim();
                return txt.length > 100 ? txt : tplMsg(name);
            } catch (e) {
                return tplMsg(name);
            }
        }

        function tplMsg(name) {
            return `${name}, জীবন একটি দীর্ঘ পথ যেখানে প্রতিটি পদক্ষেপ গুরুত্বপূর্ণ। তুমি এই পথে যে অভিজ্ঞতা অর্জন করছ তা শুধু তোমার নিজের জন্যই নয়। ${name}, মনে রাখবে যে সফলতা শুধু গন্তব্য নয়, এটি একটি যাত্রা। প্রতিটি ব্যর্থতা শেখার একটি সুযোগ, প্রতিটি চ্যালেঞ্জ তোমাকে আরও শক্তিশালী করে তোলে। জীবনে যখন কঠিন সময় আসে, তখন মনে করবে এটাও কেটে যাবে। ${name}, নিজেকে কখনো হালকা দেখো না। তুমি যে সম্ভাবনা নিয়ে এসেছ তা অসীম। প্রতিদিন একটু করে নিজে উন্নত হওয়ার চেষ্টা করো। অন্যদের মতো না হয়ে নিজেই থাকার সাহস রাখো। মানুষ তোমার সাফল্য ও ব্যর্থতা দেখবে - এটাই জীবন। গুরুত্বপূর্ণ বিষয় হলো তুমি কীভাবে প্রতিক্রিয়া দেখাও। ${name}, তুমি যে স্বপ্ন দেখো সেগুলো বাস্তবে পরিণত করার শক্তি তোমার মধ্যেই আছে। প্রতিটি দিন একটি নতুন সুযোগ নিয়ে আসে। এগিয়ে যাও আত্মবিশ্বাসের সাথে, ভবিষ্যৎ তোমার জন্য অপেক্ষা করছে।`;
        }

        startP('land', 'landCv', ['212,131,124', '196,107,98', '242,232,220'], 50);
        const sR = new WordReveal('sO', 'sI', 'sB', 'sH', 'sE');
        const vR = new WordReveal('vO', 'vI', 'vB', 'vH', 'vE');

        const $p = document.getElementById('pIn');
        const $e = document.getElementById('eTxt');
        const $c = document.getElementById('landCrd');

        document.getElementById('lBtn').addEventListener('click', doLogin);
        $p.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

        function doLogin() {
            if ($p.value.trim() === PASSWORD) {
                $e.textContent = '';
                localStorage.removeItem('visitorName');
                trans('বিশেষ বার্তা', () => {
                    showPg('sPg');
                    sR.init(SINTHI_MSG);
                    startP('s', 'sCv', ['212,131,124', '196,107,98', '242,232,220', '200,160,130'], 65);
                    playMu('sAu', 'warm');
                });
            } else {
                $e.textContent = 'পাসওয়ার্ড ভুল';
                shake($c);
                setTimeout(() => {
                    const savedName = localStorage.getItem('visitorName');
                    if (savedName) {
                        showPg('ldPg');
                        setTimeout(() => loadVisitorMessage(savedName), 300);
                    } else {
                        showPg('vIPg');
                        startP('vI', 'vICv', ['196,160,106', '176,138,80', '242,232,220'], 45);
                        document.getElementById('nIn').focus();
                    }
                }, 900);
            }
        }

        document.getElementById('nBtn').addEventListener('click', doName);
        document.getElementById('nIn').addEventListener('keydown', e => { if (e.key === 'Enter') doName(); });

        async function doName() {
            const name = document.getElementById('nIn').value.trim();
            if (!name) { document.getElementById('nEr').textContent = 'নাম দিন'; return; }
            document.getElementById('nEr').textContent = '';
            localStorage.setItem('visitorName', name);
            showPg('ldPg');
            const msg = await aiMsg(name);
            displayVisitorMessage(name, msg);
        }

        async function loadVisitorMessage(name) {
            const msg = await aiMsg(name);
            displayVisitorMessage(name, msg);
        }

        function displayVisitorMessage(name, msg) {
            document.getElementById('vTi').textContent = `${name}-র জন্য বার্তা`;
            document.getElementById('vE').textContent = `ভালো থেকো, ${name}`;
            trans(`${name}-র জন্য বার্তা`, () => {
                showPg('vMPg');
                vR.init(msg);
                startP('vM', 'vMCv', ['196,160,106', '176,138,80', '242,232,220', '180,150,100'], 55);
                playMu('vAu', 'cool');
            });
        }

        document.getElementById('sReload').addEventListener('click', () => {
            localStorage.removeItem('visitorName');
            location.reload();
        });

        document.getElementById('vReload').addEventListener('click', () => {
            localStorage.removeItem('visitorName');
            location.reload();
        });

        function scrollHandle(dir) {
            const cnt = dir > 0 ? (Math.floor(Math.random() * 3) + 2) : (Math.floor(Math.random() * 2) + 2);
            if (document.getElementById('sPg').classList.contains('on')) {
                dir > 0 ? sR.add(cnt) : sR.rem(cnt);
            } else if (document.getElementById('vMPg').classList.contains('on')) {
                dir > 0 ? vR.add(cnt) : vR.rem(cnt);
            }
        }

        function isMsgPg() {
            return document.getElementById('sPg').classList.contains('on') || document.getElementById('vMPg').classList.contains('on');
        }

        document.addEventListener('wheel', e => {
            if (!isMsgPg()) return;
            e.preventDefault();
            if (Math.abs(e.deltaY) > 12) scrollHandle(e.deltaY > 0 ? 1 : -1);
        }, { passive: false });

        let tY = 0, tT = 0;
        document.addEventListener('touchstart', e => { tY = e.touches[0].clientY; tT = Date.now(); }, { passive: true });
        document.addEventListener('touchmove', e => { if (isMsgPg()) e.preventDefault(); }, { passive: false });
        document.addEventListener('touchend', e => {
            if (!isMsgPg()) return;
            const dy = tY - e.changedTouches[0].clientY;
            if (Math.abs(dy) > 28 && Date.now() - tT < 600) scrollHandle(dy > 0 ? 1 : -1);
        }, { passive: true });

        document.addEventListener('keydown', e => {
            if (!isMsgPg()) return;
            if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); scrollHandle(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); scrollHandle(-1); }
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && 'cusp'.includes(e.key.toLowerCase())) e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && 'ijc'.includes(e.key.toLowerCase())) e.preventDefault();
            if (e.key === 'PrintScreen') {
                e.preventDefault();
                document.body.style.filter = 'brightness(0)';
                setTimeout(() => document.body.style.filter = '', 200);
            }
        });

        $p.focus();
    </script>
</body>
